<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>ShiftSignal Review</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="ShiftSignal review home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span><strong>ShiftSignal</strong><small>Interview review</small></span>
      </a>
      <div class="top-actions">
        <button id="signals-button" class="signals-button" type="button">Signals overview</button>
        <div class="local-pill"><span></span> Local intelligence</div>
      </div>
    </header>

    <main class="app-shell">
      <aside class="session-rail" aria-label="Interview sessions">
        <div class="rail-heading">
          <div><p class="eyebrow">Research library</p><h1>Interviews</h1></div>
          <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh sessions">↻</button>
        </div>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="session-search" type="search" placeholder="Filter interviews" autocomplete="off">
        </label>
        <p id="session-count" class="session-count"></p>
        <div id="session-list" class="session-list"></div>
      </aside>

      <section id="detail" class="detail" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="empty-mark" aria-hidden="true">S</div>
          <p class="eyebrow">Evidence before interpretation</p>
          <h2>Select an interview to review</h2>
          <p>Inspect the finding, its supporting turns, objective coverage, and the complete finalized transcript.</p>
        </div>
      </section>
    </main>
  </body>
</html>
